[workspace]
name = "quantum-classical-equivalence"
description = "Simulations for the Looking-Glass Transform paper"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.0"
scipy = ">=1.13"
matplotlib = ">=3.9"

[tasks]
collapse-sim = { cmd = "python entangled_collapse_sim.py", description = "Entangled-pair collapse: signed Liouville flow + conditioning vs quantum; writes collapse_sim_out/" }
eigenstate-drift-sim = { cmd = "python eigenstate_drift_sim.py", description = "Quantum eigenstates of x^4/4 under classical Liouville flow: size of the dropped term; writes eigenstate_drift_sim_out/" }
scaled-state-sim = { cmd = "python scaled_state_sim.py", description = "Ground state of x^4/4 scaled x10: classical Liouville vs exact quantum evolution; writes scaled_state_sim_out/ (~9 min)" }
hydrogen-ground-sim = { cmd = "python hydrogen_ground_sim.py", description = "Hydrogen 1s Wigner function under classical Kepler flow (exact 3D reduction to r, p_r, L); writes hydrogen_ground_sim_out/ (~3 min)" }
glass-figs = { cmd = "python glass_potential_figs.py", description = "Looking-glass potential slide figures (Lennard-Jones, transmon) into docs/img/" }
signed-particle-sim = { cmd = "python signed_particle_sim.py", description = "Classical trajectories + signed momentum jumps vs exact quantum in x^4/4; writes signed_particle_sim_out/ (~3 min)" }
lattice-jump-sim = { cmd = "python lattice_jump_sim.py", description = "Lattice -V0 cos kx: classical flight + discrete jumps of +/- hbar k/2 vs exact quantum; writes lattice_jump_sim_out/ (~12 min)" }
